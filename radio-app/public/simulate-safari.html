<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airwaves — iOS Safari simulation</title>
    <style>
      /* iPhone 12 / 13 / 14 logical viewport and chrome metrics. */
      :root {
        --device-w: 390px;
        --device-h: 844px;
        --status-h: 47px;   /* iOS status bar (drives --safe-top in the app)   */
        --safari-h: 50px;   /* Safari bottom URL toolbar                         */
        --home-h: 34px;     /* home indicator (drives --safe-bottom in the app) */
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 32px 16px;
        background: #1b1b22;
        color: #cfcfd6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      h1 { font-size: 15px; font-weight: 600; margin: 0; opacity: 0.8; }

      .device {
        position: relative;
        width: var(--device-w);
        height: var(--device-h);
        border-radius: 44px;
        background: #000;
        padding: 8px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }
      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 36px;
        overflow: hidden;
        background: #e8e8e8;
      }

      /* The live app. Sized to the full screen; the app's own safe-area padding
         (driven by --safe-top / --safe-bottom, injected on load) keeps content
         out from under the status bar and Safari toolbar. */
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* Mock iOS status bar. */
      .statusbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: var(--status-h);
        z-index: 10;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 26px 6px;
        font-size: 14px;
        font-weight: 600;
        color: #1a1a1a;
        pointer-events: none;
      }
      .statusbar .right { display: flex; align-items: center; gap: 6px; }
      .notch {
        position: absolute;
        top: 9px;
        left: 50%;
        transform: translateX(-50%);
        width: 124px;
        height: 30px;
        background: #000;
        border-radius: 18px;
        z-index: 11;
      }

      /* Mock Safari bottom URL bar + home indicator. */
      .safari-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(var(--safari-h) + var(--home-h));
        z-index: 10;
        background: rgba(245, 245, 247, 0.94);
        backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }
      .urlbar {
        margin-top: 7px;
        width: 78%;
        height: 36px;
        border-radius: 12px;
        background: #e3e3e6;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #555;
        gap: 6px;
      }
      .home-indicator {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 134px;
        height: 5px;
        border-radius: 3px;
        background: #111;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <h1>iPhone 12 · Safari (bottom URL bar) — live app</h1>

    <div class="device">
      <div class="screen">
        <iframe id="app" src="./" title="Airwaves app"></iframe>

        <div class="notch"></div>
        <div class="statusbar">
          <span>12:23</span>
          <span class="right">●●● 📶 🔋</span>
        </div>

        <div class="safari-bottom">
          <div class="urlbar">🔒 nc0der-ai.github.io</div>
          <div class="home-indicator"></div>
        </div>
      </div>
    </div>

    <script>
      // Same-origin iframe: inject the safe-area insets the real device would
      // report, so the app's env()-fallback variables resolve on desktop.
      const frame = document.getElementById("app");
      const css = getComputedStyle(document.documentElement);
      const safeTop = css.getPropertyValue("--status-h").trim();
      const safeBottom = (
        parseInt(css.getPropertyValue("--safari-h")) +
        parseInt(css.getPropertyValue("--home-h"))
      ) + "px";
      frame.addEventListener("load", () => {
        const root = frame.contentDocument.documentElement;
        root.style.setProperty("--safe-top", safeTop);
        root.style.setProperty("--safe-bottom", safeBottom);
      });
    </script>
  </body>
</html>
